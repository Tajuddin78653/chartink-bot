services:
  - type: web
    name: chartink-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: PAPER_TRADING
        value: "true"
      - key: CAPITAL
        value: "20000"
      - key: RISK_PERCENT
        value: "1"
      - key: SL_PERCENT
        value: "2"
      - key: TRAIL_PERCENT
        value: "2"
      - key: MAX_TRADES
        value: "2"
      - key: SCAN_MINS
        value: "5"
